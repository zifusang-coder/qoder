name: newmedia
# 宿主机使用 15432/16379，避免与本机其他 Postgres/Redis 冲突

# api / worker / migrate 共用同一套生产环境变量
x-app-env: &app-env
  ENV: production
  DATABASE_URL: postgresql+asyncpg://app:app@db:5432/newmedia
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置}
  MASTER_KEY: ${MASTER_KEY:?MASTER_KEY 未设置}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD 未设置}
  # 前端与 API 同源（nginx 反代 /api），CORS 只影响直连 API 的场景
  CORS_ORIGINS: http://localhost:8080
  SKILLS_DIR: /skills
  OUTPUTS_DIR: /data/outputs
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: newmedia
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d newmedia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 生产编排：docker compose --profile app up -d --wait
  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-2}", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment: *app-env
    volumes:
      - outputs:/data/outputs
    ports:
      # 只绑回环：对外入口统一走 web 反代；8010 供本机抓取 /metrics
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["arq", "app.worker.WorkerSettings"]
    environment: *app-env
    volumes:
      - outputs:/data/outputs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "arq", "app.worker.WorkerSettings", "--check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    profiles: ["app"]
    build:
      context: ./web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  outputs:
