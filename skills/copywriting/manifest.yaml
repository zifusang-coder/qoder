id: copywriting
name: 平台短文案
version: "0.1.0"
layer: produce
description: 按平台生成短视频口播、视频号文案或知乎回答的开头段落
inputs:
  type: object
  required: [topic, platform]
  properties:
    topic:
      type: string
    platform:
      type: string
      enum: [douyin, channels, zhihu, kuaishou, bilibili]
    duration_seconds:
      type: integer
      default: 60
    key_points:
      type: string
context:
  profile: true
  references: []
outputs:
  format: markdown
llm:
  tier: standard
  temperature: 0.7
tools: [llm]
cost_estimate_tokens: 1500
