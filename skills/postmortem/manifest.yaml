id: postmortem
name: 内容复盘
version: "0.1.0"
layer: attribute
description: 基于发布数据与内容版本，产出可执行的复盘结论与记忆候选
inputs:
  type: object
  required: [title, platform, metrics]
  properties:
    title:
      type: string
      description: 内容标题
    platform:
      type: string
      description: 目标平台，如 wechat/xiaohongshu/douyin
    metrics:
      type: object
      description: '发布数据，如 {"views": 1000, "likes": 50}'
    content_excerpt:
      type: string
      description: 内容摘要（可选）
    publish_time:
      type: string
      description: 发布时间，ISO 8601（可选）
context:
  profile: true
  references: []
outputs:
  format: json
llm:
  tier: standard
  temperature: 0.4
tools: [llm]
cost_estimate_tokens: 2500
