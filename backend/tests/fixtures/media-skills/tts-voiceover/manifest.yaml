id: tts-voiceover
name: 口播配音（测试）
version: "0.1.0"
layer: produce
description: 测试用配音技能，产出固定文件
inputs:
  type: object
  required: [text, output_dir]
  properties:
    text:
      type: string
    output_dir:
      type: string
    title:
      type: string
    voice_name:
      type: string
    rate:
      type: string
    instructions:
      type: string
context:
  profile: false
  references: []
outputs:
  format: json
llm:
  tier: fast
  temperature: 0.2
tools: [llm, script]
postprocess: scripts/render.py
postprocess_timeout: 30
cost_estimate_tokens: 10
