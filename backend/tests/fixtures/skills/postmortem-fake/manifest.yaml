id: postmortem-fake
name: 复盘测试桩
version: "0.1.0"
layer: attribute
description: 用于复盘流程测试的固定输出技能桩
inputs:
  type: object
  required: [title, platform, metrics]
  properties:
    title:
      type: string
      description: 内容标题
    platform:
      type: string
      description: 发布平台
    metrics:
      type: object
      description: 发布数据
    content_excerpt:
      type: string
      description: 内容摘要（可选）
    publish_time:
      type: string
      description: 发布时间，ISO 8601（可选）
context:
  profile: true
  references: []
outputs:
  format: json
llm:
  tier: fast
  temperature: 0.2
tools: [llm]
cost_estimate_tokens: 1200
